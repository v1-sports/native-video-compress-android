name: native_video_compress
description: "Android-only fork of native_video_compress (V1 Sports). iOS uses AVAssetExportSession in the host app."
version: 0.0.5
homepage: https://github.com/v1-sports/native-video-compress-android
repository: https://github.com/v1-sports/native-video-compress-android
license: MIT

environment:
  sdk: ^3.8.1
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  path_provider: ^2.1.5
  video_player: ^2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0


flutter:
  plugin:
    platforms:
      android:
        package: com.example.native_video_compress
        pluginClass: NativeVideoCompressPlugin
